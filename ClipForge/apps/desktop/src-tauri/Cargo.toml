[package]
name = "clipforge-desktop"
version = "1.0.0"
description = "ClipForge Desktop App"
authors = ["ClipForge Team"]
license = "MIT"
repository = "https://github.com/machbrandido-art/no-code"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
