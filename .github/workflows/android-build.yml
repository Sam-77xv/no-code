name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ClipForge/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Verify pnpm installation
        run: pnpm --version

      - name: Install project dependencies
        run: |
          cd ClipForge
          pnpm install

      - name: Build web app
        run: |
          cd ClipForge
          pnpm --filter @clipforge/web build

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 25.2.9519653

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-versions: 34
          build-tools: 34.0.0
          cmake: 3.22.1
          ndk: 25.2.9519653

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Tauri dependencies
        run: |
          cd ClipForge/apps/desktop
          pnpm install

      - name: Build Android APK
        run: |
          cd ClipForge/apps/desktop
          pnpm tauri android build --release
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Rename APK
        run: |
          cd ClipForge/apps/desktop/src-tauri/target/release
          mv clipforge-desktop-release.apk ClipForge-v1.0.0.apk || true
          ls -la

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipForge-Android-APK
          path: ClipForge/apps/desktop/src-tauri/target/release/*.apk
          retention-days: 30
